[package]
rust-version = "1.95"
name = "glory-stylo-derive"
version.workspace = true
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/glory-rs/stylo"
edition = "2024"
description = "Derive crate for Stylo CSS engine"
readme = "../README.md"

[lib]
name = "stylo_derive"
path = "lib.rs"
proc-macro = true

[dependencies]
darling = { version = "0.20", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["clone-impls", "derive", "parsing"] }
synstructure = "0.13"
