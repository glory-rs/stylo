name: Glory Stylo release
on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: glory-stylo-release
  cancel-in-progress: false
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.symlinks
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glory-rs/stylo
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Configure isolated build storage
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then cache='D:/BuildCache/glory-stylo-checks'; else cache="$RUNNER_TEMP/glory-stylo-checks"; fi
          mkdir -p "$cache/cargo" "$cache/target" "$cache/tmp"
          echo "CARGO_HOME=$cache/cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$cache/target" >> "$GITHUB_ENV"
          echo "TMPDIR=$cache/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$cache/tmp" >> "$GITHUB_ENV"
          echo "TMP=$cache/tmp" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$cache/pycache" >> "$GITHUB_ENV"
      - name: Verify exact source, Rust 1.95 and engine behavior
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          cargo --config 'resolver.incompatible-rust-versions="fallback"' generate-lockfile
          python scripts/release.py --tag "$RELEASE_TAG"
          cargo test --locked --workspace
  publish:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CARGO_HOME: D:/BuildCache/glory-stylo-release/cargo
      CARGO_TARGET_DIR: D:/BuildCache/glory-stylo-release/target
      RUSTUP_HOME: D:/BuildCache/glory-stylo-release/rustup
      TEMP: D:/BuildCache/glory-stylo-release/tmp
      TMP: D:/BuildCache/glory-stylo-release/tmp
      PYTHONPYCACHEPREFIX: D:/BuildCache/glory-stylo-release/pycache
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.symlinks
      GIT_CONFIG_VALUE_0: 'true'
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glory-rs/stylo
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Prepare compiler and source plan
        run: |
          New-Item -ItemType Directory -Force $env:CARGO_HOME,$env:CARGO_TARGET_DIR,$env:RUSTUP_HOME,$env:TEMP | Out-Null
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE) { throw 'Toolchain installation failed' }
          rustup default 1.98.0
          cargo --config 'resolver.incompatible-rust-versions="fallback"' generate-lockfile
          if ($LASTEXITCODE) { throw 'Dependency resolution failed' }
          python scripts/release.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'Publication source plan failed' }
      - name: Publish exact verified packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          $remote = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG^{}"
          if ($LASTEXITCODE -or $remote -notmatch "^$env:RELEASE_COMMIT\s") { throw 'Remote release tag changed' }
          python scripts/release.py --publish --skip-github-release --tag $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'Publication failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: glory-stylo-release
          path: D:/BuildCache/glory-stylo-release/target/release/${{ inputs.tag }}
