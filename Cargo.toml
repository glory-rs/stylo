[workspace]
resolver = "3"
members = [
    "stylo_atoms",
    "stylo_dom",
    "malloc_size_of",
    "selectors",
    "servo_arc",
    "style",
    "style_derive",
    "stylo_static_prefs",
    "style_traits",
    "to_shmem",
    "to_shmem_derive",
]
default-members = ["style"]

[workspace.package]
version = "0.22.0"

[workspace.dependencies]
# in-repo dependencies (separately versioned)
selectors = { package = "glory-selectors", version = "0.41.0", path = "./selectors" }
servo_arc = { package = "glory-servo-arc", version = "0.5.0",  path = "./servo_arc" }
to_shmem = { package = "glory-to-shmem", version = "0.6.0",  path = "./to_shmem", features = ["servo"] }
to_shmem_derive = { package = "glory-to-shmem-derive", version = "0.2.0",  path = "./to_shmem_derive" }

# in-repo dependencies (main version)
malloc_size_of = { version = "0.22.0", path = "./malloc_size_of", package = "glory-stylo-malloc-size-of", features = ["servo"] }
static_prefs = { version = "0.22.0", path = "./stylo_static_prefs", package = "glory-stylo-static-prefs" }
stylo_atoms = { package = "glory-stylo-atoms", version = "0.22.0", path = "./stylo_atoms" }
dom = { version = "0.22.0", path = "./stylo_dom", package = "glory-stylo-dom" }
style_traits = { version = "0.22.0", path = "./style_traits", features = ["servo"], package = "glory-stylo-traits"}
style_derive = { version = "0.22.0", path = "./style_derive", package = "glory-stylo-derive"}
stylo = { package = "glory-stylo", version = "0.22.0", path = "./style" }

# Note: external dependencies not specified here because this file isn’t synchronized with Gecko
